name = "solarlink-cors-proxy"
main = "worker.js"
compatibility_date = "2024-09-01"

# GOOGLE_SPREADSHEET_ID and GOOGLE_SIGNIN_CLIENT_ID aren't sensitive on their
# own (one's just an ID visible in the sheet's URL, the other is a public
# OAuth Client ID the browser uses openly), so they're fine as plain vars
# here. The two credential values below are NOT set here — set them as
# encrypted secrets instead:
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_EMAIL
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_KEY
# (paste the service account JSON key's "private_key" field value when prompted)
[vars]
GOOGLE_SPREADSHEET_ID = "1Sq2AYWWDOBvlrrvcesw3bxrJHWE0xe-m5i_qkG46BCY"
GOOGLE_SIGNIN_CLIENT_ID = "336493659847-g7ip6cjvb4un4ouru4fod3605a50q2gu.apps.googleusercontent.com"
