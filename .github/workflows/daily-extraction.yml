name: Daily inverter data extraction

on:
  schedule:
    # Runs at 01:00 UTC every day — adjust to suit your timezone / quota pacing.
    - cron: "0 1 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: Run daily extraction
        working-directory: automation
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SP_SITE_HOSTNAME: ${{ secrets.SP_SITE_HOSTNAME }}
          SP_SITE_PATH: ${{ secrets.SP_SITE_PATH }}
          SP_LIBRARY_NAME: ${{ secrets.SP_LIBRARY_NAME }}
          SP_FOLDER_PATH: ${{ secrets.SP_FOLDER_PATH }}
        run: npm run extract
