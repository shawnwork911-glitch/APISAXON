name: Daily inverter data extraction

on:
  schedule:
    # Runs at 01:00 UTC every day — adjust to suit your timezone / quota pacing.
    - cron: "0 1 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: TEMPORARY — DNS/network diagnostics for FusionSolar
        continue-on-error: true
        run: |
          echo "--- Default resolver ---"
          nslookup sg5.fusionsolar.huawei.com || true
          echo "--- Google DNS (8.8.8.8) ---"
          nslookup sg5.fusionsolar.huawei.com 8.8.8.8 || true
          echo "--- Cloudflare DNS (1.1.1.1) ---"
          nslookup sg5.fusionsolar.huawei.com 1.1.1.1 || true
          echo "--- Comparison: the GLOBAL endpoint (intl) ---"
          nslookup intl.fusionsolar.huawei.com || true
          echo "--- curl verbose to sg5 ---"
          curl -v --max-time 10 https://sg5.fusionsolar.huawei.com/thirdData/login || true

      - name: Run daily extraction
        working-directory: automation
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: npm run extract
