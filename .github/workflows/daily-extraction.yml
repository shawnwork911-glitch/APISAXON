name: Daily inverter data extraction

on:
  schedule:
    # Runs at 01:00 UTC every day — adjust to suit your timezone / quota pacing.
    - cron: "0 1 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: TEMPORARY — test Worker /diag from GitHub's own network
        continue-on-error: true
        run: |
          curl -s https://solarlink-cors-proxy.saxon-solarlink.workers.dev/diag | tee /tmp/diag.json
          echo ""
          echo "--- parsed ---"
          cat /tmp/diag.json | python3 -m json.tool || cat /tmp/diag.json

      - name: Run daily extraction
        working-directory: automation
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: npm run extract
